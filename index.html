<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRT 字幕配音</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./studio.css">
</head><body><main>
<header><h1>SRT 字幕配音</h1><a href="/account">账户与充值</a></header>
<div class="workspace">
<section aria-labelledby="source"><h2 id="source">字幕配音</h2>
<label for="srtFiles">字幕文件 <small>可多选 .srt</small></label>
<input type="file" id="srtFiles" accept=".srt" multiple>
<label for="engineSelect">配音引擎</label>
<select id="engineSelect"><option value="local">本地神经配音</option><option value="polly">在线 TTS · Amazon Polly</option><option value="original" disabled>原版 TTS · 未配置 Azure</option></select>
<div id="onlineFields" hidden><label for="onlineVoice">语言与音色</label><select id="onlineVoice"></select>
<p id="engineNote"></p><div id="pollyLogin"></div></div>
<div id="neuralFields"><label for="neuralVoice">语言与音色</label><select id="neuralVoice"><option value="cmn">普通话 · Huayan</option><option value="ja">日语 · CSS10</option><option value="en-us">英语 · Lessac</option><option value="ko">韩语 · KSS</option><option value="de">德语 · Thorsten</option></select><button type="button" id="neuralDownload">下载并缓存音色</button></div>
<div class="voice-example"><button type="button" id="sampleBtn" onclick="startBatchConversion(true)">测试当前配音</button>
<p id="sampleText"></p></div>
<label for="speedModeSelect">时间轴对齐</label>
<select id="speedModeSelect"><option value="natural" selected>自然语速（超时顺延）</option><option value="仅加速">仅压缩超时语音</option><option value="加速和减速">拉伸或压缩至字幕时长</option></select>
</section>
<section aria-labelledby="settings"><h2 id="settings">声音设置</h2>
<fieldset><legend>情绪与题材预设</legend>
<div class="presets" id="presetContainer">
<button type="button" class="preset-btn active" onclick="applyPreset(0, 0, 0, this)">默认原声</button>
<button type="button" class="preset-btn" onclick="applyPreset(0, 0, -5, this)">都市情感</button>
<button type="button" class="preset-btn" onclick="applyPreset(-15, -10, 5, this)">复仇</button>
<button type="button" class="preset-btn" onclick="applyPreset(20, 15, 5, this)">搞笑</button>
<button type="button" class="preset-btn" onclick="applyPreset(-15, -5, 0, this)">宫廷</button>
<button type="button" class="preset-btn" onclick="applyPreset(15, 10, 15, this)">家庭冲突</button>
<button type="button" class="preset-btn" onclick="applyPreset(-20, -15, -10, this)">惊悚</button>
<button type="button" class="preset-btn" onclick="applyPreset(-15, -10, 0, this)">末世</button>
<button type="button" class="preset-btn" onclick="applyPreset(10, -5, 10, this)">男频</button>
<button type="button" class="preset-btn" onclick="applyPreset(25, 10, 15, this)">热血逆袭</button>
<button type="button" class="preset-btn" onclick="applyPreset(15, 5, 10, this)">爽文</button>
<button type="button" class="preset-btn" onclick="applyPreset(-5, 10, -5, this)">甜宠</button>
<button type="button" class="preset-btn" onclick="applyPreset(5, 10, 0, this)">校园爱情</button>
<button type="button" class="preset-btn" onclick="applyPreset(-15, -10, -5, this)">悬疑</button>
<button type="button" class="preset-btn" onclick="applyPreset(10, 0, 5, this)">御兽</button>
<button type="button" class="preset-btn" onclick="applyPreset(0, -5, 5, this)">重生</button>
</div></fieldset>
<div class="adjustments"><div class="adjust"><label for="rateSlider">语速</label>
        <input type="range" id="rateSlider" min="-50" max="100" value="0" oninput="updateValue('rateSlider','rateVal','%',true,true)">
        <output id="rateVal" for="rateSlider">+0%</output>
        <button class="reset-link" aria-label="重置语速" onclick="resetSlider('rateSlider',0,'rateVal','%',true)">重置</button></div>
<div class="adjust"><label for="pitchSlider">音调</label>
        <input type="range" id="pitchSlider" min="-50" max="50" value="0" oninput="updateValue('pitchSlider','pitchVal','Hz',true,true)">
        <output id="pitchVal" for="pitchSlider">+0Hz</output>
        <button class="reset-link" aria-label="重置音调" onclick="resetSlider('pitchSlider',0,'pitchVal','Hz',true)">重置</button></div>
<div class="adjust"><label for="volumeSlider">音量</label>
        <input type="range" id="volumeSlider" min="-50" max="50" value="0" oninput="updateValue('volumeSlider','volVal','%',true,true)">
        <output id="volVal" for="volumeSlider">+0%</output>
        <button class="reset-link" aria-label="重置音量" onclick="resetSlider('volumeSlider',0,'volVal','%',true)">重置</button></div></div></section>
</div>
<div class="run"><label class="check"><input type="checkbox" id="autoDlToggle" onchange="toggleAutoDl()">完成后自动下载</label><button id="submitBtn" onclick="startBatchConversion()">开始配音</button></div>
<p id="notice" role="status" hidden></p>
<section class="results" aria-labelledby="history"><div class="result-head"><h2 id="history">配音记录</h2><button onclick="clearFinishedTasks()">清理历史记录</button></div>
<div id="taskList"></div><p class="empty">暂无配音记录</p></section>
</main><script src="./studio.js"></script><script src="./neural.js"></script><script src="./online.js"></script></body></html>
