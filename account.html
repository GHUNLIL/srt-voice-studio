<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户与充值 · 字幕配音</title><style>*{box-sizing:border-box}body{max-width:680px;margin:24px auto;padding:0 16px;color:#111;font:15px/1.5 system-ui,sans-serif}header,nav,.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}header,section{border-bottom:1px solid;padding:12px 0}nav{gap:14px}a{color:inherit}h1{font-size:23px;margin:0}h2{font-size:17px;margin:6px 0}label{display:block;margin:12px 0}input,button,select{font:inherit;border:1px solid #333;border-radius:0;padding:7px;background:white;color:inherit}input,select{display:block;width:100%}button{cursor:pointer}button:disabled{opacity:.55}#balance{font-size:26px}#msg{overflow-wrap:anywhere}li{margin:8px 0}small{color:#555}[hidden]{display:none!important}</style></head><body>
<header><h1>账户与充值</h1><nav><a href="/">返回配音</a><button id="logout">退出登录</button></nav></header>
<section><div id="identity"></div><strong id="balance"></strong><p id="billing"></p><form id="topup" hidden><label>充值金额（元）<input id="amount" type="number" min="1" max="10000" step="1" value="1" required></label><p id="quote"></p><button>前往 UnlilPay 付款</button></form></section>
<p id="msg" role="status"></p><section><h2>充值记录</h2><ul id="orders"></ul></section>
<section id="adminbox" hidden><h2>管理员设置</h2><h2>点数与支付</h2><form id="config"><label>每充值 1 元到账点数<input id="ratio" type="number" min="0" max="1000000" required></label><label>UnlilPay 商户 PID<input id="pid" maxlength="64"></label><label>商户签名密钥<input id="secret" type="password" autocomplete="new-password" placeholder="留空沿用已保存密钥"></label><label>付款渠道<select id="channel"><option value="alipay">支付宝</option><option value="stripe">Stripe</option><option value="usdt">USDT</option></select></label><button>保存设置</button></form></section>
<script>
const el=id=>document.getElementById(id);let account;
async function api(path,data){
 const options=data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{};
 const r=await fetch('/api/'+path,options);if(r.status===401){location.replace('/login');throw Error('请重新登录');}
 const result=await r.json();if(!r.ok)throw Error(result.error);return result;
}
async function action(button,fn){button.disabled=true;el('msg').textContent='';try{await fn();}catch(e){el('msg').textContent=e.message;}finally{button.disabled=false;}}
function quote(){el('quote').textContent='预计到账 '+(Number(el('amount').value)*account.ratio)+' 点';}
async function refresh(){
 account=await api('me');el('identity').textContent=account.name+(account.admin?' · 管理员':'');el('balance').textContent=account.balance+' 点';
 el('billing').textContent=(account.enabled?'每元 '+account.ratio+' 点。':'充值尚未开放。')+' 本地神经配音免费。';el('topup').hidden=!account.enabled;quote();
 el('adminbox').hidden=!account.admin;if(account.admin){for(const f of ['ratio','pid','channel'])el(f).value=account[f];}
 el('orders').replaceChildren();if(!account.orders.length)el('orders').textContent='暂无充值记录';
 for(const o of account.orders){const li=document.createElement('li');li.textContent=new Date(o.created*1000).toLocaleString()+' · ¥'+(o.cents/100).toFixed(2)+' · '+o.points+' 点 · '+(o.paid?'已到账':'待支付')+' ';
 if(!o.paid){const b=document.createElement('button');b.textContent='查询到账';b.onclick=()=>action(b,async()=>{const r=await api('order/check',{id:o.id});await refresh();el('msg').textContent=r.paid?'已到账':'尚未支付';});li.append(b);}
 el('orders').append(li);}
}
el('amount').oninput=quote;
el('logout').onclick=e=>action(e.target,async()=>{await api('logout',{});location.replace('/login');});
el('topup').onsubmit=e=>{e.preventDefault();action(e.submitter,async()=>{const d=await api('recharge',{yuan:Number(el('amount').value)});location.assign(d.url);});};
el('config').onsubmit=e=>{e.preventDefault();action(e.submitter,async()=>{await api('admin/settings',{ratio:Number(el('ratio').value),pid:el('pid').value,secret:el('secret').value,channel:el('channel').value});el('secret').value='';await refresh();el('msg').textContent='设置已保存。';});};
(async()=>{const order=new URLSearchParams(location.search).get('order');try{if(order)await api('order/check',{id:order});}catch(e){el('msg').textContent=e.message;}await refresh();})().catch(e=>el('msg').textContent=e.message);
</script></body></html>
