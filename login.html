<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · SRT 字幕配音</title><style>*{box-sizing:border-box}body{max-width:380px;margin:8vh auto;padding:16px;color:#111;font:16px/1.5 system-ui,sans-serif}h1{font-size:24px;border-bottom:2px solid;padding-bottom:12px}label,input{display:block}input,button{font:inherit;background:white;border:1px solid;color:inherit;padding:9px;border-radius:0}input{width:100%;margin:4px 0 16px}button{cursor:pointer}button:first-of-type{background:#111;color:white}footer{font-size:14px;margin-top:14px}</style></head><body><h1>SRT 字幕配音</h1><form id="auth"><label>用户名<input name="name" autocomplete="username" required minlength="2" maxlength="32"></label><label>密码<input type="password" name="password" autocomplete="current-password" required minlength="8" maxlength="128"></label><button value="login">登录</button> <button value="register">注册并登录</button></form><footer id="msg" role="status">用户名 2–32 位，密码 8–128 位。</footer><script>
const form=document.querySelector('form');
form.onsubmit=async e=>{e.preventDefault();const action=e.submitter?.value||'login';const data=Object.fromEntries(new FormData(form));for(const b of form.querySelectorAll('button'))b.disabled=true;
try{const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/');}catch(err){document.querySelector('#msg').textContent=err.message;}finally{for(const b of form.querySelectorAll('button'))b.disabled=false;}};
</script></body></html>
